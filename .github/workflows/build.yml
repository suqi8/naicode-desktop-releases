# 打全部客户端，发到本仓库的 Releases。
# 只能手动触发（Actions → 打包全部客户端 → Run workflow）；不响应 push / pull_request，fork 的 PR 拿不到 secrets。
name: 打包全部客户端

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要打包的分支、标签或提交
        required: true
        default: wip-snapshot
      tag:
        description: Release 标签；留空自动生成 build-<日期>-<提交前 7 位>
        required: false
        default: ""
      fast:
        description: 桌面安装包用快速压缩（体积更大，测试用）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-all
  cancel-in-progress: false

env:
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.33.2"
  ZCODE_ENV: production

jobs:
  source:
    name: 解析源码提交
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          fetch-depth: 1
          path: src
      - id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          sha=$(git -C src rev-parse HEAD)
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then tag="build-$(date -u +%Y%m%d)-${sha:0:7}"; fi
          if ! [[ "$tag" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "::error::Release 标签只能包含字母、数字、点、下划线和连字符"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  desktop:
    name: 桌面 ${{ matrix.name }}
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, runner: windows-latest, os: win, arch: x64 }
          - { name: Windows arm64, runner: windows-11-arm, os: win, arch: arm64 }
          - { name: macOS arm64, runner: macos-latest, os: mac, arch: arm64 }
          - { name: macOS x64, runner: macos-15-intel, os: mac, arch: x64 }
          - { name: Linux x64, runner: ubuntu-24.04, os: linux, arch: x64 }
          - { name: Linux arm64, runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # 入库的 pnpm-lock.yaml 可能落后于 workspace，因此不用 frozen。
      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile
      # Linux 目标是 AppImage、deb、rpm、pacman：rpm 需要 rpmbuild，pacman 需要 bsdtar。
      - name: 安装 Linux 打包工具
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      # deb/rpm/pacman 的包元数据必须带 homepage，否则 electron-builder 报 "Please specify project homepage"。
      # 只改本次构建的工作副本，用本发布仓库的地址作为主页。
      - name: 写入 Linux 包主页
        if: matrix.os == 'linux'
        working-directory: packages/desktop
        env:
          HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
        run: npm pkg set "homepage=$HOMEPAGE"
      - name: 打包
        shell: bash
        env:
          # 未配置 Apple 签名：不自动找证书，产出未签名、未公证的包。
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          FAST_FLAG: ${{ inputs.fast && '--fast' || '' }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Git Bash 的 GNU tar 会把 "D:/..." 里的 "D:" 当成远程主机名而解包失败；
            # 只把 tar 换成 Windows 自带的 bsdtar（与本机打包一致），其余工具不动。
            shim="$(cygpath -u "$RUNNER_TEMP")/win-tar"
            mkdir -p "$shim"
            cp /c/Windows/System32/tar.exe "$shim/tar.exe"
            export PATH="$shim:$PATH"
          fi
          pnpm bundle:desktop -- --os ${{ matrix.os }} --arch ${{ matrix.arch }} $FAST_FLAG
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.pkg.tar.zst
            packages/desktop/dist/*.tar.gz

  cli:
    name: 命令行 CLI（六平台）
    needs: source
    # 在 macOS 上打：macOS 目标注入后需要 ad-hoc 签名（codesign 只在 macOS 上有），否则 Apple 芯片拒绝运行。
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile
      - name: 打包
        run: pnpm build:sea
      - name: 改为发行名
        shell: bash
        run: |
          mkdir -p out
          for name in darwin-arm64 darwin-x64 linux-arm64 linux-x64 windows-arm64.exe windows-x64.exe; do
            cp "apps/zcode-cli/packages/cli/dist/zcode-$name" "out/naicode-desktop-cli-$name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          if-no-files-found: error
          path: out/*

  android:
    name: Android
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: 准备签名密钥
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secret ANDROID_KEYSTORE_BASE64，正式版无法签名"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: 打包
        working-directory: packages/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease --no-daemon --console=plain
      - name: 改为发行名
        shell: bash
        run: |
          mkdir -p out
          cp packages/android/app/build/outputs/apk/release/app-release.apk out/naicode-remote-android.apk
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: out/*

  release:
    name: 发布 Release
    needs: [source, desktop, cli, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成校验和
        shell: bash
        run: |
          cd dist
          ls -la
          sha256sum -- * > SHA256SUMS.txt
      - name: 创建 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.source.outputs.tag }}
        run: |
          cat > notes.md <<EOF
          | 客户端 | 文件 |
          | --- | --- |
          | Windows 桌面版 | \`*-win-x64.exe\`、\`*-win-arm64.exe\` |
          | macOS 桌面版 | \`*-mac-arm64.dmg\`（Apple 芯片）、\`*-mac-x64.dmg\`（Intel） |
          | Linux 桌面版 | \`*-linux-*\` |
          | 命令行 CLI | \`naicode-desktop-cli-<平台>-<架构>\`，单文件，不需要另装 Node.js |
          | Android 手机远控 | \`naicode-remote-android.apk\` |

          - macOS 桌面版没有 Apple 签名和公证：首次打开在「访达」里右键 → 打开；仍被拦时执行 \`xattr -dr com.apple.quarantine "/Applications/NaiCode Desktop.app"\`。
          - macOS / Linux 的 CLI 下载后先 \`chmod +x\`。
          - 校验和见 \`SHA256SUMS.txt\`。
          EOF
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "NaiCode Desktop $TAG" \
            --notes-file notes.md \
            --prerelease
